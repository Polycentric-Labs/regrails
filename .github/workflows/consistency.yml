name: consistency

# S3 — anti-drift gates. Runs on every push and PR to main and fails the tree if:
#   * version literals disagree (tag/pyproject/package)            check_version_consistency.py
#   * the CLI feature surface and the web/docs surface diverge     check_parity.py
#   * the committed web/public/data drifted from a fresh build     tests/test_web_data_parity.py
#   * an in-repo Markdown link is broken                           check_docs_links.py
# Same uv setup as test.yml / release.yml. Read-only; no publish, no secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consistency:
    name: version + parity + web-data + docs-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project + dev deps
        run: uv sync --extra dev

      - name: Version consistency (pyproject == package == web)
        run: uv run python scripts/check_version_consistency.py

      - name: CLI <-> web/docs parity
        run: uv run python scripts/check_parity.py

      - name: Web-data anti-drift gate
        run: uv run pytest tests/test_web_data_parity.py -ra -q

      - name: Doc link check (in-repo Markdown links resolve)
        run: uv run python scripts/check_docs_links.py
