name: release

# Tag-driven publish. Pushing a tag like v0.3.0 builds the package, attaches a
# SLSA build-provenance attestation, and publishes to PyPI via a Trusted Publisher
# (OIDC — no long-lived token) with PEP 740 attestations. Push-to-main does NOT
# publish; only a v* tag does.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # S2 — tag-time gate. A red tree must BLOCK the PyPI publish. This job runs the
  # SAME checks as test.yml (ruff + mypy + pytest) plus the version-consistency
  # check, scoped to a fast no-publish lane; the `release` job below gates on it
  # via `needs: gate`, so an unsigned/broken tag can never reach PyPI. This job
  # holds NO id-token/attestations permissions — it only needs to read the repo.
  gate:
    name: tag-time gate (tests + types + lint + version)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project + dev deps
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Run unit tests
        run: uv run pytest -ra -q

      - name: Version consistency (tag == pyproject == package)
        run: uv run python scripts/check_version_consistency.py

  release:
    name: build + attest + publish
    needs: gate            # S2 — do NOT publish if the gate job failed (red tree blocks PyPI)
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # PyPI Trusted Publisher OIDC + PEP 740 attestations
      attestations: write   # actions/attest-build-provenance (SLSA)
      contents: read
    # NOTE: if the PyPI Trusted Publisher was registered with an Environment name,
    # add a matching `environment:` block here. Registered without one -> omit it.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: SLSA build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (Trusted Publisher + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
