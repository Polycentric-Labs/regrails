name: secret-scan

# S4 — gitleaks secret scan on every push and PR. Catches an accidentally committed
# API key / token / private key before it reaches the public repo. Defense-in-depth
# behind .gitignore (which already excludes .env*, *.pem, *.key, secrets/) and the
# .githooks/commit-msg attribution gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so gitleaks scans every commit on a push, not just the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Polycentric-Labs is a GitHub Organization; gitleaks-action requires a
          # (free) GITLEAKS_LICENSE for org repos. Add it as a repo/org secret. If
          # absent, this step fails closed — which is the safe default for a secret
          # gate. (Personal-account repos do not need the license.)
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
