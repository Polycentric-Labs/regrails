name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: pytest + faithfulness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project + dev deps
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Run unit tests
        run: uv run pytest -ra -q

      - name: Faithfulness gate (FERPA + Title IV)
        run: uv run regrails check faithfulness --verbose

      - name: Coverage matrix
        run: uv run regrails coverage report

      - name: Verify committed decision provenance chain
        run: uv run regrails audit verify demo/recorded-runs/decisions.chain.jsonl
