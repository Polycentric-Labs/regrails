name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: pytest + faithfulness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project + dev deps
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Run unit tests
        run: uv run pytest -ra -q

      - name: Faithfulness gate
        run: uv run regrails check faithfulness --verbose
