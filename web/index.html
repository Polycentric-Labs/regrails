<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="RegRails — an open-source FERPA / Title-IV policy-as-code guardrail. A deterministic engine decides before any LLM speaks."
    />
    <title>RegRails — policy-as-code guardrail</title>
    <!--
      No-FOUC theme bootstrap. Runs before first paint so the page never flashes
      the wrong palette. Mirrors useTheme.ts: persisted choice wins, else the OS
      preference. Sets BOTH the .dark class (token swap) and data-theme (hook
      state + test assertions). Wrapped in try/catch so a blocked localStorage
      (private mode) degrades to light instead of throwing.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("regrails-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark"
            ? stored
            : prefersDark
            ? "dark"
            : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          if (theme === "dark") root.classList.add("dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
